<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختيار الوان النقشات</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
      <!-- Header Section -->
    <header>
        <div class="container">
            <h1>اختيار الوان النقشات</h1>
            <p class="welcome-message">في هذا الموقع ستقوم عزيزي المدير "ياسر البحري" باختيار الوان النقشات عبر لوحة مستقلة لكل نقشة</p>
            
            <div class="stats-container">
                <div class="stat-box">
                    <h3>التصاميم الجاهزة بدون الوان</h3>
                    <div class="count" id="ready-count">5</div>
                </div>
                <div class="stat-box">
                    <h3>التصاميم الجاهزة كلياً</h3>
                    <div class="count" id="completed-count">2</div>
                </div>
            </div>
            
            <a href="pics-board.html" class="nav-button">الذهاب الى صفحة التصاميم الجاهزة</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="designs-grid" id="designs-grid">
            <!-- Design containers will be generated by JavaScript -->
        </div>
    </main>

    <!-- Color Selection Modal -->
    <div class="color-modal" id="color-modal">
        <div class="modal-content">
            <div class="modal-header">اختيار الوان التصميم</div>
            
            <div class="color-selection-container">
                <div class="color-versions" id="color-versions">
                    <!-- Version containers will be generated by JavaScript -->
                </div>
                
                <div class="design-preview">
                    <div class="preview-header">
                        <div class="preview-number" id="preview-number">1</div>
                        <div class="preview-status status-not-selected" id="preview-status">لم يتم الاختيار</div>
                    </div>
                    <div class="preview-image">
                        <img src="" alt="تصميم" id="preview-image">
                    </div>
                </div>
            </div>
            
            <div class="modal-actions">
                <button class="action-button confirm-btn" id="confirm-btn">تأكيد الالوان</button>
                <button class="action-button save-btn" id="save-btn">حفظ مؤقت</button>
                <button class="action-button reset-btn" id="reset-btn">تصفير الخانات</button>
                <button class="action-button back-btn" id="back-btn">عودة الى صفحة النقشات</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
