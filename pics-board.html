<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التصاميم الجاهزة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="container">
            <div class="header-title">
                <h1>جاهز يا عم</h1>
                <div class="smile-icon">😊</div>
            </div>
            
            <div class="stats-container">
                <div class="stat-box">
                    <h3>التصاميم الجاهزة بدون الوان</h3>
                    <div class="count" id="ready-count">5</div>
                </div>
                <div class="stat-box">
                    <h3>التصاميم الجاهزة كلياً</h3>
                    <div class="count" id="completed-count">2</div>
                </div>
            </div>
            
            <a href="index.html" class="nav-button">العودة الى الصفحة الرئيسية</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="designs-grid" id="designs-grid">
            <!-- Design containers will be generated by JavaScript -->
        </div>

        <!-- Versions Section -->
        <div class="versions-section" id="versions-section">
            <div class="versions-header">
                <div class="versions-title" id="versions-title">الإصدارات للتصميم <span id="selected-design-number">1</span></div>
                <button class="back-button" id="back-to-designs">العودة إلى قائمة التصاميم</button>
            </div>
            <div class="versions-grid" id="versions-grid">
                <!-- Version containers will be generated by JavaScript -->
            </div>
        </div>
    </main>
    <script src="pics-board.js"></script>
</body>
</html>
